<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h2>Register with Email</h2>

  <form (ngSubmit)="onSubmit()">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email" required />
    <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Register' }}</button>
  </form>

  <div class="divider">or</div>
  <button class="btn outline" id="googleBtn" (click)="signupWithGoogle()">Sign up with Google</button>

  <p id="msg" class="muted">{{ msg }}</p>
</main>
