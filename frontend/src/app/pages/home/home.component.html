<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/about">About</a>
    <a routerLink="/contact">Contact</a>
    <a routerLink="/download">Download</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>

    <div id="userMenu" class="user-menu">
      <img id="avatar" [src]="avatarUrl" alt="avatar" />
      <span id="uname">{{ username }}</span>
      <div class="dropdown">
        <a *ngIf="isAdmin" routerLink="/admin">Admin</a>
        <a routerLink="/settings">Settings</a>
        <button id="logoutBtn" class="linklike" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="container">
  <!-- Pure CSS/JS Carousel (Angular version) -->
  <div
    class="carousel"
    id="carousel"
    *ngIf="carouselItems.length > 0"
    (mouseenter)="pauseCarousel()"
    (mouseleave)="resumeCarousel()"
  >
    <div
      class="carousel-track"
      id="carousel-track"
      [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'"
    >
      <div class="carousel-slide" *ngFor="let it of carouselItems; let i = index">
        <img [src]="it.image_dataurl" [alt]="it.title || ('slide ' + (i + 1))" />
      </div>
    </div>

    <button
      class="carousel-prev"
      id="carousel-prev"
      aria-label="รูปก่อนหน้า"
      title="< รูปก่อนหน้า"
      (click)="prev()"
      [disabled]="carouselItems.length <= 1"
    >
      &lt;
    </button>
    <button
      class="carousel-next"
      id="carousel-next"
      aria-label="รูปถัดไป"
      title="> รูปถัดไป"
      (click)="next()"
      [disabled]="carouselItems.length <= 1"
    >
      &gt;
    </button>

    <div class="carousel-indicators" id="carousel-indicators">
      <button
        *ngFor="let it of carouselItems; let i = index"
        type="button"
        [attr.aria-label]="'slide ' + (i + 1)"
        (click)="goTo(i)"
        [style.opacity]="i === currentIndex ? '1' : '.75'"
      >
        <img [src]="it.image_dataurl" alt="" />
      </button>
    </div>
  </div>

  <div id="carousel-caption-box" class="card" *ngIf="currentItem">
    <h3 id="cc-title">{{ currentItem.title }}</h3>
    <h5 id="cc-subtitle" class="muted">{{ currentItem.subtitle }}</h5>
    <p id="cc-desc">{{ currentItem.description }}</p>
  </div>

  <hr />

  <h2 id="welcome_header">{{ welcomeHeader }}</h2>
  <p id="main_paragraph">{{ mainParagraph }}</p>
</main>
