<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/about">About</a>
    <a routerLink="/contact">Contact</a>
    <a routerLink="/download">Download</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>

    <div id="userMenu" class="user-menu">
      <img id="avatar" [src]="avatarUrl" alt="avatar" />
      <span id="uname">{{ username }}</span>
      <div class="dropdown">
        <a routerLink="/settings">Settings</a>
        <a routerLink="/admin" *ngIf="isAdmin">Admin</a>
        <button id="logoutBtn" class="linklike" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="container">
  <h1>Hello, <span id="uname">{{ username }}</span></h1>

  <p class="notice" *ngIf="msg">{{ msg }}</p>

  <div class="card-grid">
    <div class="card">
      <h2>Welcome Header</h2>
      <p>{{ welcomeHeader }}</p>
    </div>
    <div class="card">
      <h2>Main Paragraph</h2>
      <p>{{ mainParagraph }}</p>
    </div>
  </div>

  <section
    class="carousel"
    *ngIf="carouselItems.length"
    (mouseenter)="pauseCarousel()"
    (mouseleave)="resumeCarousel()"
  >
    <div
      class="carousel-track"
      id="carousel-track"
      [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
    >
      <div class="carousel-item" *ngFor="let item of carouselItems">
        <img [src]="item.image_dataurl" alt="carousel image" />
        <div class="carousel-caption">
          <h3>{{ item.title }}</h3>
          <p>{{ item.subtitle }}</p>
          <p>{{ item.description }}</p>
        </div>
      </div>
    </div>

    <button class="carousel-btn prev" id="prevBtn" (click)="prev()">‹</button>
    <button class="carousel-btn next" id="nextBtn" (click)="next()">›</button>

    <div class="carousel-indicators" id="indicators">
      <button
        *ngFor="let item of carouselItems; let i = index"
        [class.active]="i === currentIndex"
        (click)="goTo(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
      >
        <img [src]="item.image_dataurl" alt="thumb" />
      </button>
    </div>
  </section>
</main>
