<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/home" class="active">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>

    <div id="userMenu" class="user-menu">
      <img id="avatar" [src]="avatarUrl" alt="avatar" />
      <span id="uname">{{ username }}</span>
      <div class="dropdown">
        <a routerLink="/settings">Settings</a>
        <button id="logoutBtn" class="linklike" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<main class="container small">
  <h1>Settings</h1>

  <div class="center">
    <img id="avatarLarge" [src]="avatarUrl" alt="avatar large" class="avatar-large" />
  </div>

  <div class="card">
    <h2>Update Username</h2>
    <label>Username</label>
    <input type="text" [(ngModel)]="newUsername" />
    <button class="btn" (click)="saveUsername()" [disabled]="busy">
      Save
    </button>
  </div>

  <div class="card">
    <h2>Update Profile Picture</h2>
    <input id="avatarInput" type="file" accept="image/*" (change)="onAvatarSelected($event)" />
  </div>

  <div class="card danger">
    <h2>Delete Account</h2>
    <button class="btn danger" id="deleteBtn" (click)="deleteAccount()" [disabled]="busy">
      Delete Account
    </button>
  </div>

  <p class="notice" *ngIf="msg">{{ msg }}</p>
</main>
