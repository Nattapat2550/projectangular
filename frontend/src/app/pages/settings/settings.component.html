<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/home">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h2>Settings</h2>

  <form id="settingsForm" (ngSubmit)="save()">
    <label>Username</label>
    <input type="text" id="username" [(ngModel)]="username" name="username" />
    <button class="btn" type="submit" [disabled]="loadingSave">{{ loadingSave ? 'Saving...' : 'Save' }}</button>
  </form>

  <div style="height:1rem"></div>

  <form id="avatarForm" (ngSubmit)="uploadAvatar()">
    <label>Upload new profile picture</label>
    <input
      type="file"
      id="avatarFile"
      accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
      (change)="onFile($event)"
    />
    <button class="btn" type="submit" [disabled]="loadingUpload">{{ loadingUpload ? 'Uploading...' : 'Upload' }}</button>
  </form>

  <hr />
  <button id="deleteBtn" class="btn danger" (click)="deleteAccount()" [disabled]="loadingDelete">
    {{ loadingDelete ? 'Deleting...' : 'Delete my account' }}
  </button>

  <p id="msg" class="muted">{{ msg }}</p>
</main>
