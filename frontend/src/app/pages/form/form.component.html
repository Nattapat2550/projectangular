<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/" class="active">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container small">
  <h1>Complete profile</h1>

  <form (ngSubmit)="onSubmit()">
    <p>Account: <strong>{{ email }}</strong></p>

    <label>Username</label>
    <input type="text" [(ngModel)]="username" name="username" required />

    <label>Password</label>
    <input
      [type]="showPw ? 'text' : 'password'"
      [(ngModel)]="password"
      name="password"
      required
    />

    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="showPw" name="showPw" />
      Show password
    </label>

    <button class="btn" type="submit" [disabled]="loading">
      {{ loading ? 'Saving…' : 'Save' }}
    </button>

    <p class="notice" *ngIf="msg">{{ msg }}</p>
  </form>
</main>
