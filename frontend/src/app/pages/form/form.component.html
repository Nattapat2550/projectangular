<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h2>Set username &amp; password</h2>

  <form (ngSubmit)="onSubmit()">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email" required />

    <label>Username</label>
    <input type="text" [(ngModel)]="username" name="username" minlength="3" required />

    <label>Password</label>
    <input type="password" [(ngModel)]="password" name="password" minlength="8" required />

    <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Save' }}</button>
  </form>

  <p id="msg" class="muted">{{ msg }}</p>
</main>
