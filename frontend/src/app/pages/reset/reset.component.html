<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h2>Reset Password</h2>

  <!-- Request reset link -->
  <div id="requestBox" *ngIf="!token">
    <form (ngSubmit)="requestReset()">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required />
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send reset link' }}</button>
    </form>
  </div>

  <!-- Perform reset -->
  <div id="resetBox" *ngIf="token">
    <form (ngSubmit)="doReset()">
      <label>New password</label>
      <input type="password" [(ngModel)]="newPassword" name="newPassword" minlength="8" required />
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Saving...' : 'Reset password' }}</button>
    </form>
  </div>

  <p id="msg" class="muted">{{ msg }}</p>
</main>
