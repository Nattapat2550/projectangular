<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h2>Enter 6-digit code</h2>

  <form (ngSubmit)="onSubmit()">
    <label>Code</label>
    <input type="text" [(ngModel)]="code" name="code" maxlength="6" required />
    <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Verify' }}</button>
  </form>

  <p id="msg" class="muted">{{ msg }}</p>
</main>
