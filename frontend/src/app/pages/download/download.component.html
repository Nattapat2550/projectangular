<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/" class="active">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container">
  <h1>Download</h1>
  <div class="card-grid">
    <div class="card">
      <h2>Windows</h2>
      <p>Download the Windows version.</p>
      <button class="btn" id="downloadWindows" (click)="downloadWindows()">
        Download for Windows
      </button>
    </div>
    <div class="card">
      <h2>Android</h2>
      <p>Download the Android version.</p>
      <button
        class="btn outline"
        id="downloadAndroid"
        (click)="downloadAndroid()"
      >
        Download for Android
      </button>
    </div>
  </div>
</main>
