<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/home" class="active">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>

    <div id="userMenu" class="user-menu">
      <img id="avatar" [src]="avatarUrl" alt="avatar" />
      <span id="uname">{{ username }}</span>
      <div class="dropdown">
        <a routerLink="/settings">Settings</a>
        <button class="linklike" id="logoutBtn" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<main class="container">
  <h1>Admin</h1>
  <p>Manage homepage content, carousel, and users.</p>

  <p class="notice" *ngIf="msg">{{ msg }}</p>

  <section class="card">
    <h2>Homepage Content</h2>

    <div class="row">
      <div style="flex: 1">
        <label>Welcome Header</label>
        <input [(ngModel)]="welcomeHeader" />
      </div>
      <div style="flex: 2">
        <label>Main Paragraph</label>
        <textarea rows="3" [(ngModel)]="mainParagraph"></textarea>
      </div>
    </div>

    <button class="btn" (click)="saveHomepage()">Save Homepage</button>
  </section>

  <section class="card">
    <h2>Users</h2>

    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Email</th>
          <th>Username</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.id }}</td>
          <td>{{ u.email }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.role }}</td>
          <td>
            <select [(ngModel)]="u.role">
              <option value="user">user</option>
              <option value="admin">admin</option>
            </select>
            <button class="btn outline" (click)="saveUser(u)">Save</button>
          </td>
        </tr>
      </tbody>
    </table>
  </section>

  <section class="card">
    <h2>Carousel</h2>

    <div class="card-grid">
      <div class="card" *ngFor="let item of carousel">
        <h3>#{{ item.item_index }} - {{ item.title }}</h3>
        <p>{{ item.subtitle }}</p>

        <label>Title</label>
        <input [(ngModel)]="item.title" />

        <label>Subtitle</label>
        <input [(ngModel)]="item.subtitle" />

        <label>Description</label>
        <textarea rows="3" [(ngModel)]="item.description"></textarea>

        <label>Image</label>
        <input type="file" accept="image/*" (change)="onFile($event, item)" />

        <div class="row">
          <button class="btn" (click)="saveCarousel(item)">Save</button>
          <button class="btn danger" (click)="deleteCarousel(item)">Delete</button>
        </div>
      </div>

      <div class="card">
        <h3>Add New</h3>

        <label>Title</label>
        <input [(ngModel)]="newItem.title" />

        <label>Subtitle</label>
        <input [(ngModel)]="newItem.subtitle" />

        <label>Description</label>
        <textarea rows="3" [(ngModel)]="newItem.description"></textarea>

        <label>Image</label>
        <input type="file" accept="image/*" (change)="onNewFile($event)" />

        <button class="btn" (click)="addCarousel()">Add</button>
      </div>
    </div>
  </section>
</main>
