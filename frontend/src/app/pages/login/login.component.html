<nav class="nav">
  <div class="brand">MySite</div>
  <div class="links">
    <a routerLink="/" class="active">Home</a>
    <button id="themeToggle" (click)="toggleTheme()">🌓</button>
  </div>
</nav>

<main class="container small">
  <h1>Login</h1>

  <form (ngSubmit)="onSubmit()">
    <label>Email</label>
    <input type="email" [(ngModel)]="email" name="email" required />

    <label>Password</label>
    <input
      [type]="showPw ? 'text' : 'password'"
      [(ngModel)]="password"
      name="password"
      required
    />

    <div class="row">
      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="remember" name="remember" />
        Remember me
      </label>

      <label class="checkbox">
        <input type="checkbox" [(ngModel)]="showPw" name="showPw" />
        Show password
      </label>
    </div>

    <button class="btn" type="submit">Login</button>

    <div class="row">
      <a class="btn outline" routerLink="/register">Register</a>
      <button class="btn outline" type="button" (click)="loginWithGoogle()">
        Continue with Google
      </button>
    </div>

    <p>
      <a routerLink="/reset">Forgot password?</a>
    </p>

    <p class="notice" *ngIf="msg">{{ msg }}</p>
  </form>
</main>
